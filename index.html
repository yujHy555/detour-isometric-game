<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>DETOUR - 3D Isometric Adventure</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f18;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }
    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .title-badge {
      background: rgba(18, 22, 38, 0.85);
      border: 1px solid rgba(80, 200, 255, 0.35);
      border-radius: 8px;
      padding: 10px 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
    }
    .title-badge h1 {
      font-size: 1.25rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #64d8ff;
      margin-bottom: 4px;
    }
    .title-badge p {
      font-size: 0.78rem;
      color: #8c9cb8;
    }
    .status-panel {
      background: rgba(18, 22, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.82rem;
      color: #a0aec0;
      backdrop-filter: blur(8px);
    }
    .status-panel .status-val {
      color: #38ef7d;
      font-weight: bold;
    }
    .controls-hint {
      align-self: center;
      background: rgba(15, 18, 28, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 6px 18px;
      font-size: 0.8rem;
      color: #cbd5e0;
      backdrop-filter: blur(6px);
      margin-bottom: 10px;
    }
    .controls-hint kbd {
      background: #2d3748;
      border: 1px solid #4a5568;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: inherit;
      color: #63b3ed;
    }

    /* Virtual Joystick for Mobile */
    #mobile-controls {
      display: none;
      position: absolute;
      bottom: 24px;
      left: 24px;
      right: 24px;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 20;
    }
    .joystick-zone {
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      position: relative;
      pointer-events: auto;
    }
    .joystick-knob {
      width: 48px;
      height: 48px;
      background: rgba(100, 216, 255, 0.6);
      border-radius: 50%;
      position: absolute;
      top: 36px;
      left: 36px;
      pointer-events: none;
      box-shadow: 0 0 12px rgba(100, 216, 255, 0.6);
    }
    .mobile-btn {
      width: 64px;
      height: 64px;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(100, 216, 255, 0.4);
      border-radius: 50%;
      color: #fff;
      font-weight: bold;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      backdrop-filter: blur(4px);
    }
    .mobile-btn:active {
      background: rgba(100, 216, 255, 0.4);
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud-overlay">
    <div class="top-bar">
      <div class="title-badge">
        <h1>DETOUR 3D</h1>
        <p>AAA Isometric Character Engine</p>
      </div>
      <div class="status-panel">
        <div>Rig Status: <span id="rig-status" class="status-val">Procedural Test Rig</span></div>
        <div>Camera: <span class="status-val">Isometric (45° / 35.2°)</span></div>
      </div>
    </div>

    <div class="controls-hint">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or <kbd>Arrows</kbd> Move (Isometric) &bull; 
      <kbd>Shift</kbd> Sprint &bull; 
      <kbd>Space</kbd> Jump &bull; 
      <kbd>Mouse</kbd> Aim &amp; Rotate
    </div>
  </div>

  <div id="mobile-controls">
    <div class="joystick-zone" id="touch-joystick">
      <div class="joystick-knob" id="joystick-knob"></div>
    </div>
    <div style="display: flex; gap: 12px;">
      <div class="mobile-btn" id="btn-touch-jump">JUMP</div>
      <div class="mobile-btn" id="btn-touch-action">ACT</div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
